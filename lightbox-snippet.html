<!-- 1) Add this once, right before </main> (or just before </body>) in project-detail.html -->
<div class="pd-lightbox" id="pd-lightbox" aria-hidden="true">
  <button class="pd-lightbox__close" type="button" data-lb-close aria-label="Close">&times;</button>
  <button class="pd-lightbox__nav pd-lightbox__prev" type="button" data-lb-prev aria-label="Previous photo">&#8249;</button>
  <img class="pd-lightbox__img" id="pd-lightbox-img" src="" alt="">
  <button class="pd-lightbox__nav pd-lightbox__next" type="button" data-lb-next aria-label="Next photo">&#8250;</button>
</div>

<!-- 2) Add this <script> block right after your existing project-detail script (or at the end of body, after js/main.js) -->
<script>
(function () {
  var lb = document.getElementById("pd-lightbox");
  if (!lb) return;
  var lbImg = document.getElementById("pd-lightbox-img");
  var items = [];
  var current = 0;

  function collectItems() {
    items = Array.prototype.slice.call(document.querySelectorAll(".pd-gallery-item img"));
  }

  function openAt(index) {
    collectItems();
    if (!items.length) return;
    current = (index + items.length) % items.length;
    lbImg.src = items[current].src;
    lbImg.alt = items[current].alt || "";
    lb.classList.add("is-open");
    lb.setAttribute("aria-hidden", "false");
    document.body.style.overflow = "hidden";
  }
  function close() {
    lb.classList.remove("is-open");
    lb.setAttribute("aria-hidden", "true");
    document.body.style.overflow = "";
  }
  function next() { openAt(current + 1); }
  function prev() { openAt(current - 1); }

  document.addEventListener("click", function (e) {
    var galleryItem = e.target.closest(".pd-gallery-item");
    if (galleryItem) {
      e.preventDefault();
      collectItems();
      var img = galleryItem.querySelector("img");
      var idx = items.indexOf(img);
      openAt(idx < 0 ? 0 : idx);
      return;
    }
    if (e.target === lb || e.target.closest("[data-lb-close]")) close();
    if (e.target.closest("[data-lb-next]")) next();
    if (e.target.closest("[data-lb-prev]")) prev();
  });

  document.addEventListener("keydown", function (e) {
    if (!lb.classList.contains("is-open")) return;
    if (e.key === "Escape") close();
    if (e.key === "ArrowRight") next();
    if (e.key === "ArrowLeft") prev();
  });
})();
</script>
